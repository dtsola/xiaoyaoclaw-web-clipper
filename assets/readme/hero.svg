<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">OpenClaw Web Clipper</title>
  <desc id="hero-desc">Save any web page as clean local Markdown with frontmatter. Dual-engine extraction (readability + trafilatura fallback), Chinese-safe filenames, batch clipping with dedup, output lands in knowledge/clippings/ ready for kb-retriever indexing. Shows a clip terminal with extracted article metadata and a saved Markdown result.</desc>

  <rect width="1200" height="360" rx="20" fill="#0d1117"/>

  <!-- left: title block -->
  <g id="title-block" transform="translate(56 40)">
    <text x="0" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="4" fill="#8b949e">OPENCLAW · AGENT SKILL</text>

    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="52" font-weight="800" fill="#e6edf3">Web</text>
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="52" font-weight="800" fill="#e6edf3">Clipper</text>

    <text x="0" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#c9d1d9">网页剪藏 · 双引擎提取 · 知识喂料</text>
    <text x="0" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#8b949e">local Markdown · batch + dedup · Win + macOS</text>

    <text x="0" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1" fill="#8b949e">MIT LICENSE · SKILL FOR OPENCLAW · v1.0.0</text>
  </g>

  <!-- right: clip terminal panel -->
  <g id="terminal-panel" transform="translate(700 44)">
    <rect width="450" height="276" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>

    <!-- terminal dots -->
    <circle cx="18" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="54" cy="20" r="5" fill="#27c93f"/>

    <text x="78" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b949e">web-clipper · clip</text>

    <!-- clip command -->
    <text x="24" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#58a6ff">$ python clip.py &lt;URL&gt;</text>

    <!-- extraction progress -->
    <circle cx="30" cy="92" r="5" fill="#3fb950"/>
    <text x="48" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">engine  readability → trafilatura</text>

    <circle cx="30" cy="120" r="5" fill="#3fb950"/>
    <text x="48" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">title   科技爱好者周刊（第 410 期）</text>

    <circle cx="30" cy="148" r="5" fill="#3fb950"/>
    <text x="48" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">meta    author · date · domain · tags</text>

    <circle cx="30" cy="176" r="5" fill="#d29922"/>
    <text x="48" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">dedup   .clips-index.json 已跳过 1 条</text>

    <!-- saved hint -->
    <text x="24" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#58a6ff">$ python build_index.py &lt;knowledge&gt;</text>

    <!-- summary line -->
    <text x="24" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">saved: 20260828_周刊410期.md · 7.1k 字</text>
    <text x="24" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3fb950">local-only · ready for kb-retriever</text>
  </g>
</svg>
